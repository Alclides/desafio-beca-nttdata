server:
  port: ${SERVER_PORT:8082}

spring:
  config:
    # Ao rodar pela IDE, lê o .env da raiz (no Docker ele não existe e é ignorado)
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: ms-transactions
  datasource:
    url: ${TRANSACTIONS_DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  http:
    client:
      connect-timeout: 2s
      read-timeout: 3s

management:
  endpoints:
    web:
      exposure:
        include: health

integrations:
  users-url: ${USERS_SERVICE_URL:http://localhost:8081}
  mockapi-url: ${MOCKAPI_URL:}
  brasilapi-url: ${BRASILAPI_URL:https://brasilapi.com.br/api}


springdoc:
  api-docs:
    override-with-generic-response: false
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
