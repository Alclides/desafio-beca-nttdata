server:
  port: ${SERVER_PORT:8082}

spring:
  config:
    # Ao rodar pela IDE, lê o .env da raiz (no Docker ele não existe e é ignorado)
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: ms-transactions
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/transactions_db}
    username: ${DB_USER:beca}
    password: ${DB_PASSWORD:beca123}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health

integrations:
  users-url: ${USERS_SERVICE_URL:http://localhost:8081}
  mockapi-url: ${MOCKAPI_URL:}
  brasilapi-url: ${BRASILAPI_URL:https://brasilapi.com.br/api}
